<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUT-Studio</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="app-header">
      <h1>LUT-Studio</h1>
      <p id="status">画像を読み込んでください</p>
      <label class="header-check">
        <input id="mask-preview" type="checkbox" />
        選択範囲を表示
      </label>
      <label class="header-select">
        表示サイズ
        <input id="tile-size" type="range" min="160" max="960" step="20" value="320" />
      </label>
      <label class="header-select">
        テーマ
        <select id="theme-select">
          <option value="dark">ダーク</option>
          <option value="gray">ライトグレー</option>
          <option value="black">ブラック</option>
          <option value="white">ホワイト</option>
        </select>
      </label>
    </header>
    <div id="main">
      <section id="stage">
        <div id="dropzone">
          <p>画像をドラッグ＆ドロップ</p>
          <button id="open" type="button">画像を選択…</button>
          <input id="file-input" type="file" accept="image/*" multiple hidden />
        </div>
        <div id="grid"></div>
      </section>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
